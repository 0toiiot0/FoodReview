<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛집 주머니 | 어디갈래</title>
  <link rel="stylesheet" href="mypage.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">어디갈래</a>
      <div class="auth-slot" id="authSlot">
        <button class="btn-pill btn-pill-outline auth-login-btn" id="authLoginBtn" type="button">로그인</button>
      </div>
    </div>
  </header>

  <header class="page-header">
    <h1 class="page-header__title">맛집 주머니</h1>
    <p class="page-header__desc">내가 담은 맛집을 모아서 확인하고, 필요 없는 곳은 바로 정리해보세요.</p>
  </header>

  <main class="mypage">
    <div class="bookmark-login-prompt" id="bookmarkLoginPrompt" hidden>
      <p class="bookmark-login-prompt__text">로그인이 필요해요.</p>
      <button class="btn-pill bookmark-cta-btn" id="bookmarkLoginBtn" type="button">로그인하러 가기</button>
    </div>

    <p class="bookmark-status" id="bookmarkStatus" aria-live="polite"></p>

    <div class="bookmark-filter" id="bookmarkFilter" role="group" aria-label="상태별 보기">
      <button type="button" class="bookmark-filter__btn is-active" data-filter="all">전체 <span class="bookmark-filter__count" data-count="all">0</span></button>
      <button type="button" class="bookmark-filter__btn" data-filter="planned">가볼 예정 <span class="bookmark-filter__count" data-count="planned">0</span></button>
      <button type="button" class="bookmark-filter__btn" data-filter="visited">다녀옴 <span class="bookmark-filter__count" data-count="visited">0</span></button>
    </div>

    <div class="bookmark-grid" id="bookmarkGrid"></div>

    <p class="bookmark-filter-empty" id="bookmarkFilterEmpty" hidden>선택한 상태의 맛집이 없어요.</p>

    <div class="bookmark-empty" id="bookmarkEmpty" hidden>
      <p class="bookmark-empty__text">아직 담은 맛집이 없어요.. 검색하러 가볼까요?</p>
      <a class="btn-pill bookmark-cta-btn" href="restaurants.html">맛집 검색하러 가기</a>
    </div>
  </main>

  <div class="auth-modal" id="authModal" hidden aria-hidden="true">
    <div class="auth-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
      <button class="auth-modal__close" id="authModalClose" type="button" aria-label="닫기">&times;</button>
      <h2 class="auth-modal__title" id="authModalTitle">로그인</h2>
      <p class="auth-modal__message" id="authModalMessage" hidden></p>
      <form class="auth-modal__form" id="authForm">
        <div class="auth-modal__field">
          <label for="authName">이름</label>
          <input type="text" id="authName" name="name" autocomplete="name" placeholder="회원가입 시 필요해요">
        </div>
        <div class="auth-modal__field">
          <label for="authEmail">이메일</label>
          <input type="email" id="authEmail" name="email" autocomplete="email" required>
        </div>
        <div class="auth-modal__field">
          <label for="authPassword">비밀번호</label>
          <input type="password" id="authPassword" name="password" autocomplete="current-password" required>
        </div>
        <div class="auth-modal__actions">
          <button type="submit" class="btn-pill auth-modal__submit-login" id="authSubmitLogin">로그인</button>
          <button type="button" class="btn-pill btn-pill-outline" id="authSubmitSignup">회원가입</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="page-footer">
    <p class="page-footer__text">&copy; 2026 어디갈래. 담아둔 맛집은 로그인한 계정에서만 볼 수 있어요.</p>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="mypage.js"></script>
</body>
</html>
