<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맛집 검색 | 자리있어</title>
  <link rel="stylesheet" href="restaurants.css" />
</head>
<body>
  <header class="page-header">
    <a class="page-header__logo" href="index.html">자리있어</a>
    <h1 class="page-header__title">맛집 담기</h1>
    <p class="page-header__desc">키워드나 카테고리로 주변 맛집을 검색하고 모임 자리를 정해보세요.</p>
  </header>

  <main class="restaurants">
    <form class="search-bar" id="searchForm">
      <label class="search-bar__label" for="searchKeyword">키워드</label>
      <input
        class="search-bar__input"
        type="text"
        id="searchKeyword"
        name="searchKeyword"
        placeholder="예: 강남 파스타, 홍대 술집"
        autocomplete="off"
      />

      <label class="search-bar__label" for="searchCategory">카테고리</label>
      <select class="search-bar__category" id="searchCategory" name="searchCategory">
        <option value="">전체</option>
        <option value="FD6">음식점</option>
        <option value="CE7">카페</option>
      </select>

      <button class="search-bar__button" type="submit">검색</button>
    </form>

    <section class="result-section" aria-live="polite">
      <p class="result-status" id="resultStatus"></p>
      <div class="result-grid" id="resultGrid"></div>
      <button class="search-results__more-btn" id="moreButton" type="button" hidden disabled>더 보기</button>
    </section>
  </main>

  <footer class="page-footer">
    <p class="page-footer__text">&copy; 2026 자리있어. 이 페이지의 검색 결과는 카카오 로컬 API를 통해 제공됩니다.</p>
  </footer>

  <script src="config.js"></script>
  <script src="restaurants.js"></script>
</body>
</html>
